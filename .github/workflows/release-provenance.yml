name: Release Provenance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 10.6.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sources and packages
        run: |
          pnpm build
          pnpm -r build

      - name: Smoke test built CLI
        run: node packages/cli/dist/bin.js scan --json > /dev/null

      - name: Package build artifact
        run: tar -czf "agentforge-build-${GITHUB_SHA}.tgz" .build packages/*/dist README.md docs SECURITY.md package.json pnpm-lock.yaml

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: agentforge-build-${{ github.sha }}
          path: agentforge-build-${{ github.sha }}.tgz

      - name: Attest build provenance
        if: ${{ github.event.repository.private == false || vars.AGENTFORGE_ENABLE_PRIVATE_ATTESTATION == 'true' }}
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: agentforge-build-${{ github.sha }}.tgz

      - name: Note skipped provenance attestation
        if: ${{ github.event.repository.private == true && vars.AGENTFORGE_ENABLE_PRIVATE_ATTESTATION != 'true' }}
        run: |
          echo "GitHub artifact attestation is skipped because this repository is private." >> "$GITHUB_STEP_SUMMARY"
          echo "Make the repository public, or set AGENTFORGE_ENABLE_PRIVATE_ATTESTATION=true after enabling private attestations for the org, to re-enable this step." >> "$GITHUB_STEP_SUMMARY"
