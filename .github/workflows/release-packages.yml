name: Release Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.6.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sources and packages
        run: |
          pnpm build
          pnpm -r build

      - name: Dry run public package archives
        run: pnpm pack:public

      - name: Verify packed public packages
        run: pnpm release:verify

      - name: Configure npm publish mode
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "NPM_CONFIG_PROVENANCE=false" >> "$GITHUB_ENV"
            echo "npm package provenance is disabled because this repository is private. Make the repository public to re-enable provenance automatically." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NPM_CONFIG_PROVENANCE=true" >> "$GITHUB_ENV"
            echo "npm package provenance is enabled for this public repository." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create release PR or publish
        uses: changesets/action@v1.7.0
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          commit: "Version public AgentForge packages"
          title: "Version public AgentForge packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
