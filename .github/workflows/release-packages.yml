name: Release Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_CONFIG_PROVENANCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.6.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sources and packages
        run: |
          pnpm build
          pnpm -r build

      - name: Dry run public package archives
        run: pnpm pack:public

      - name: Create release PR or publish
        uses: changesets/action@v1.7.0
        with:
          version: pnpm release:version && pnpm install --lockfile-only
          publish: pnpm release:publish
          commit: "Version public AgentForge packages"
          title: "Version public AgentForge packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
