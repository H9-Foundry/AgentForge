name: AgentForge PR Review

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      workflow_name:
        description: AgentForge workflow to run
        required: false
        default: pr-review
      tracker_issue:
        description: Tracker issue number to update
        required: false
        default: "1"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        !startsWith(github.event.pull_request.head.ref, 'changeset-release/')
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'changeset-release/')
      )
    runs-on: ubuntu-latest
    env:
      AGENTFORGE_WORKFLOW_NAME: ${{ github.event.inputs.workflow_name || 'pr-review' }}
      AGENTFORGE_TRACKER_ISSUE: ${{ github.event.inputs.tracker_issue || '1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.1
        with:
          version: 10.6.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sources and packages
        run: |
          pnpm build
          pnpm -r build

      - name: Smoke test built CLI
        run: node packages/cli/dist/bin.js scan --json > /dev/null

      - name: Run AgentForge workflow
        run: pnpm exec tsx --tsconfig tsconfig.base.json packages/cli/src/bin.ts run "$AGENTFORGE_WORKFLOW_NAME" --json > agentforge-run.json

      - name: Derive artifact paths
        id: artifact_paths
        run: node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('agentforge-run.json','utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'bundle_path=' + data.jsonPath + '\n'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'markdown_path=' + data.markdownPath + '\n'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run_id=' + data.runId + '\n');"

      - name: Upload AgentForge artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agentforge-${{ steps.artifact_paths.outputs.run_id }}
          path: |
            ${{ steps.artifact_paths.outputs.bundle_path }}
            ${{ steps.artifact_paths.outputs.markdown_path }}
            agentforge-run.json

      - name: Publish PR and issue updates
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTFORGE_BUNDLE_PATH: ${{ steps.artifact_paths.outputs.bundle_path }}
          AGENTFORGE_REPORT_OUTPUT: agentforge-report.md
        run: node scripts/github/report-agentforge-run.mjs
