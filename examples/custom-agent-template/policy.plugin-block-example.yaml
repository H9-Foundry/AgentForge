version: 1
defaults:
  execution_mode: inspect
  model_access: false
  network: deny
  writes: approval_required
paths:
  allowed_read:
    - "**/*"
  allowed_write:
    - ".agentops/runs/**"
  blocked:
    - ".env*"
    - "secrets/**"
plugins:
  allowed_tiers:
    - core
    - verified
  allowed_sources:
    - official
  require_reviewed: true
tools:
  filesystem.read-file:
    effect: allow
